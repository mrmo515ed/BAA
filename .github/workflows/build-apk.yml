name: Build & Release Black Anime APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackAnime-app-debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0-latest
        name: "Black Anime v1.0.0 (Latest Build)"
        body: |
          ### 🚀 بلاك انمي (Black Anime) - Latest Release
          - تم بناء ملف الـ APK التلقائي بنجاح.
          - حمل التطبيق مباشرة عبر الرابط المرفق بالأسفل `app-debug.apk`.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
